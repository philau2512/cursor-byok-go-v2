// Hand-ported subset of the newer Cursor client protocol for the BYOK
// local-subscription-tool channel.
//
// Trường hợp (a) — re-extract proto bằng proto/ext_tool — chưa chạy được, nên
// bốn message dưới đây chép tay từ bản extract mới, GIỮ NGUYÊN field number và
// tên field để wire-format tương thích với client thật.
//
// Package đặt riêng (byok.agent.v1) để:
//   - không trùng definition khi proto/agent_v1.proto chính thức được sync,
//   - vẫn đăng ký handler tại procedure path thật của client (xem
//     internal/backend/forwarder/local_subscription_tools.go).
//
// Xóa file này khi bản sync (a) đã chứa các message gốc.
syntax = "proto3";

package byok.agent.v1;

option go_package = "cursor/gen/byoklocalv1;byoklocalv1";

// Copied from: agent.v1.LocalSubscriptionToolDefinition
message LocalSubscriptionToolDefinition {
  string tool_name = 1;
  string description = 2;
  string input_schema_json = 3;
}

// Copied from: agent.v1.ListLocalSubscriptionToolsRequest
message ListLocalSubscriptionToolsRequest {
}

// Copied from: agent.v1.ListLocalSubscriptionToolsResponse
message ListLocalSubscriptionToolsResponse {
  repeated LocalSubscriptionToolDefinition tools = 1;
}

// Copied from: agent.v1.CallLocalSubscriptionToolRequest
message CallLocalSubscriptionToolRequest {
  string conversation_id = 1;
  string tool_name = 2;
  string tool_args_json = 3;
}

// Copied from: agent.v1.CallLocalSubscriptionToolResponse
message CallLocalSubscriptionToolResponse {
  string result_json = 1;
  bool is_error = 2;
  optional int64 watch_expires_at_unix_ms = 3;
}
